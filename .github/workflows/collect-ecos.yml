name: Collect public market snapshot

on:
  workflow_dispatch:
  schedule:
    # 07:30 / 07:40 / 07:50 KST = 22:30 / 22:40 / 22:50 UTC (previous UTC day)
    - cron: '30 22 * * *'
    - cron: '40 22 * * *'
    - cron: '50 22 * * *'

permissions:
  contents: write

concurrency:
  group: collect-public-market
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check today's snapshot freshness
        id: freshness
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Manual run: freshness guard bypassed."
            exit 0
          fi
          TODAY="$(TZ=Asia/Seoul date +%F)"
          EXISTING="$(node -e "try{const x=require('./data/public/latest.json');process.stdout.write(x.referenceDate||'')}catch(e){}")"
          if [ "$EXISTING" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Public snapshot for $TODAY already exists; backup schedule exits without API calls."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No current KST snapshot yet: existing=${EXISTING:-none}, today=$TODAY."
          fi

      - name: Set up Node.js
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect official public-safe sources and build bundle
        if: steps.freshness.outputs.skip != 'true'
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          REF_DATE="$(TZ=Asia/Seoul date +%F)"
          mkdir -p data/snapshots/ecos data/snapshots/derived data/snapshots/treasury data/snapshots/fed-liquidity data/snapshots/us-cp data/snapshots/us-labor-signals data/snapshots/jgb data/snapshots/bis data/snapshots/boe data/snapshots/bundesbank data/snapshots/bde data/snapshots/oecd data/public data/coverage .tmp
          REFERENCE_DATE="$REF_DATE" OUTPUT_PATH="data/snapshots/ecos/$REF_DATE.json" npm run collect:ecos
          cp "data/snapshots/ecos/$REF_DATE.json" data/snapshots/ecos/latest.json
          INPUT_PATH="data/snapshots/ecos/$REF_DATE.json" OUTPUT_PATH="data/snapshots/derived/$REF_DATE.json" npm run derive:kr-rates
          cp "data/snapshots/derived/$REF_DATE.json" data/snapshots/derived/latest.json
          REFERENCE_DATE="$REF_DATE" TREASURY_OUTPUT="data/snapshots/treasury/$REF_DATE.json" NYFED_OUTPUT=".tmp/nyfed.json" npm run collect:global-rates
          cp "data/snapshots/treasury/$REF_DATE.json" data/snapshots/treasury/latest.json
          REFERENCE_DATE="$REF_DATE" OUTPUT_PATH="data/snapshots/fed-liquidity/$REF_DATE.json" npm run collect:fed-liquidity
          cp "data/snapshots/fed-liquidity/$REF_DATE.json" data/snapshots/fed-liquidity/latest.json
          REFERENCE_DATE="$REF_DATE" OUTPUT_PATH="data/snapshots/us-cp/$REF_DATE.json" npm run collect:us-cp
          cp "data/snapshots/us-cp/$REF_DATE.json" data/snapshots/us-cp/latest.json
          REFERENCE_DATE="$REF_DATE" OUTPUT_PATH="data/snapshots/us-labor-signals/$REF_DATE.json" npm run collect:us-labor-signals
          cp "data/snapshots/us-labor-signals/$REF_DATE.json" data/snapshots/us-labor-signals/latest.json
          REFERENCE_DATE="$REF_DATE" OUTPUT_PATH="data/snapshots/jgb/$REF_DATE.json" npm run collect:jgb
          cp "data/snapshots/jgb/$REF_DATE.json" data/snapshots/jgb/latest.json
          REFERENCE_DATE="$REF_DATE" OUTPUT_PATH="data/snapshots/bis/$REF_DATE.json" npm run collect:bis
          cp "data/snapshots/bis/$REF_DATE.json" data/snapshots/bis/latest.json
          REFERENCE_DATE="$REF_DATE" OUTPUT_PATH="data/snapshots/boe/$REF_DATE.json" npm run collect:boe
          cp "data/snapshots/boe/$REF_DATE.json" data/snapshots/boe/latest.json
          REFERENCE_DATE="$REF_DATE" OUTPUT_PATH="data/snapshots/bundesbank/$REF_DATE.json" npm run collect:bundesbank
          cp "data/snapshots/bundesbank/$REF_DATE.json" data/snapshots/bundesbank/latest.json
          REFERENCE_DATE="$REF_DATE" OUTPUT_PATH="data/snapshots/bde/$REF_DATE.json" npm run collect:bde
          cp "data/snapshots/bde/$REF_DATE.json" data/snapshots/bde/latest.json
          REFERENCE_DATE="$REF_DATE" OUTPUT_PATH="data/snapshots/oecd/$REF_DATE.json" npm run collect:oecd
          cp "data/snapshots/oecd/$REF_DATE.json" data/snapshots/oecd/latest.json
          ECOS_INPUT="data/snapshots/ecos/$REF_DATE.json" DERIVED_INPUT="data/snapshots/derived/$REF_DATE.json" TREASURY_INPUT="data/snapshots/treasury/$REF_DATE.json" FED_LIQUIDITY_INPUT="data/snapshots/fed-liquidity/$REF_DATE.json" US_CP_INPUT="data/snapshots/us-cp/$REF_DATE.json" US_LABOR_SIGNALS_INPUT="data/snapshots/us-labor-signals/$REF_DATE.json" JGB_INPUT="data/snapshots/jgb/$REF_DATE.json" BIS_INPUT="data/snapshots/bis/$REF_DATE.json" BOE_INPUT="data/snapshots/boe/$REF_DATE.json" BUNDESBANK_INPUT="data/snapshots/bundesbank/$REF_DATE.json" BDE_INPUT="data/snapshots/bde/$REF_DATE.json" OECD_INPUT="data/snapshots/oecd/$REF_DATE.json" OUTPUT_PATH="data/public/$REF_DATE.json" npm run build:public-snapshot
          cp "data/public/$REF_DATE.json" data/public/latest.json
          npm run build:coverage

      - name: Commit public-safe snapshots
        if: steps.freshness.outputs.skip != 'true'
        run: |
          if [ -z "$(git status --porcelain -- data/snapshots/ecos data/snapshots/derived data/snapshots/treasury data/snapshots/fed-liquidity data/snapshots/us-cp data/snapshots/us-labor-signals data/snapshots/jgb data/snapshots/bis data/snapshots/boe data/snapshots/bundesbank data/snapshots/bde data/snapshots/oecd data/public data/coverage MARKET_DATA_COVERAGE.md)" ]; then
            echo "No public-safe snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/ecos data/snapshots/derived data/snapshots/treasury data/snapshots/fed-liquidity data/snapshots/us-cp data/snapshots/us-labor-signals data/snapshots/jgb data/snapshots/bis data/snapshots/boe data/snapshots/bundesbank data/snapshots/bde data/snapshots/oecd data/public data/coverage MARKET_DATA_COVERAGE.md
          git commit -m "Update public market snapshot"
          git pull --rebase origin main
          git push
