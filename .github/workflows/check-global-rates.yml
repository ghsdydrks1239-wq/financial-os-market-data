name: Check global rates sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-global-rates.yml'
      - 'scripts/collect-jgb-v1.mjs'
      - 'config/japan-mof-jgb.v1.json'
      - 'scripts/collect-bis-v1.mjs'
      - 'config/bis-series.v1.json'
      - 'scripts/collect-boe-v1.mjs'
      - 'config/boe-series.v1.json'
      - 'scripts/debug-boe-csv.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check official public endpoints
        run: node scripts/smoke-global-rates.mjs
      - name: Test normalized collection
        run: |
          mkdir -p .tmp
          TREASURY_OUTPUT=.tmp/treasury.json NYFED_OUTPUT=.tmp/nyfed.json npm run collect:global-rates
      - name: Discover Federal Reserve Board series
        run: npm run discover:fed-board
      - name: Test Fed liquidity collection
        run: OUTPUT_PATH=.tmp/fed-liquidity.json npm run collect:fed-liquidity
      - name: Test US commercial paper collection
        run: OUTPUT_PATH=.tmp/us-cp.json npm run collect:us-cp
      - name: Test BLS Sahm Rule collection
        run: OUTPUT_PATH=.tmp/us-labor-signals.json npm run collect:us-labor-signals
      - name: Test Japan MOF JGB collection
        run: OUTPUT_PATH=.tmp/jgb.json npm run collect:jgb
      - name: Test BIS policy-rate and FX collection
        run: OUTPUT_PATH=.tmp/bis.json npm run collect:bis
      - name: Inspect Bank of England CSV response
        run: node scripts/debug-boe-csv.mjs
      - name: Test Bank of England exact 10Y gilt collection
        run: OUTPUT_PATH=.tmp/boe.json npm run collect:boe
