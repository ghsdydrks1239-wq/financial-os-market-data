name: Check MARKET DATA setup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-market-data.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check API secret setup
        run: npm run check
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}

      - name: Smoke test ECOS API
        run: npm run smoke:ecos
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}

      - name: Check KRX service approvals
        run: npm run smoke:krx
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}

      - name: Collect mapped ECOS metrics
        run: npm run collect:ecos
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}

      - name: Verify KRX selectors without logging values
        run: node scripts/verify-krx-selectors.mjs
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
